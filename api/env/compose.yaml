name: sim-dev

# Local development dependencies only; run API/Web on the host.
services:
  postgres:
    image: postgres:17-alpine
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_DB: sim_dev
      POSTGRES_USER: sim
      POSTGRES_PASSWORD: ${SIM_DEV_POSTGRES_PASSWORD:-sim_dev_password}
    ports:
      - "127.0.0.1:${SIM_DEV_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${SIM_DEV_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management-alpine
    hostname: sim-dev-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: sim
      RABBITMQ_DEFAULT_PASS: ${SIM_DEV_RABBITMQ_PASSWORD:-sim_dev_password}
      RABBITMQ_DEFAULT_VHOST: /sim_dev
    ports:
      - "127.0.0.1:${SIM_DEV_RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${SIM_DEV_RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
