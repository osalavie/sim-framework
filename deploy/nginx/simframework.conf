# 默认以 HTTP 运行；需要 HTTPS 时，取消下方 "HTTPS（可选）" 段落的注释，
# 并把证书放到 deploy/nginx-ssl/（容器内 /etc/nginx/ssl/）。
#
# 安全头说明：
# - 生产由 1Panel OpenResty 在 TLS 终结层下发 HSTS/CSP 等安全头；本文件保留同一组头，
#   保证直接以 443 部署或用其他反代时也有纵深防御。重复下发相同值的头不影响浏览器。
# - nginx 的 add_header 不会从 server 继承到任何自带 add_header 的 location，
#   因此静态资源 location 必须重复声明同一组安全头。
server {
    listen 80;
    server_name _;

    # --- HTTPS（可选） ---
    # listen 443 ssl;
    # http2 on;
    # ssl_certificate     /etc/nginx/ssl/localhost.crt;
    # ssl_certificate_key /etc/nginx/ssl/localhost.key;
    # ssl_protocols       TLSv1.2 TLSv1.3;
    # ssl_ciphers         HIGH:!aNULL:!MD5;
    # ssl_prefer_server_ciphers on;
    # ssl_session_cache   shared:SSL:10m;
    # ssl_session_timeout 10m;

    # --- Security Headers ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://v2.jinrishici.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;

    # --- Upload Size ---
    client_max_body_size 50m;

    # --- SPA Static Files ---
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Static Assets Caching ---
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        # 本 location 自带 add_header，不会再继承 server 级安全头，必须重复
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://v2.jinrishici.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
        try_files $uri =404;
    }
}
