# 1Panel OpenResty 默认 server
# 生产路径：/opt/1panel/apps/openresty/openresty/conf/default/00.default.conf
#
# 公网 80 经 frp http 隧道直连本机 80，不发送 PROXY protocol；
# 默认 80 监听不要带 proxy_protocol，否则会 400。
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    listen 443 quic reuseport default_server;
    listen [::]:443 quic reuseport default_server;
    server_name _;
    index 404.html;
    root /usr/share/nginx/html;
    include /usr/local/openresty/nginx/conf/ssl/root_ssl.conf;
    http2 on;
    ssl_reject_handshake on;
}
