<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" preserveAspectRatio="xMidYMid slice" role="img" aria-label="loading">
  <style>
    .wave-base {
      fill: #5f84e2;
      fill-opacity: 0.1;
    }
    .wave-band {
      animation: wave-flow 3.78s linear infinite;
    }
    .wave-band--back {
      fill: #5f84e2;
      fill-opacity: 0.4;
      animation-delay: -1.32s;
    }
    .wave-band--front {
      fill: #1b4fd6;
      fill-opacity: 0.4;
    }
    .wave-swell {
      animation: wave-swell 6s ease-in-out infinite alternate;
    }
    .wave-swell--front {
      animation-duration: 8.5s;
      animation-direction: alternate-reverse;
    }
    @keyframes wave-flow {
      from {
        transform: translateX(0);
      }
      to {
        transform: translateX(480px);
      }
    }
    @keyframes wave-swell {
      from {
        transform: translateY(180px) scaleY(0.7) translateY(-180px);
      }
      to {
        transform: translateY(180px) scaleY(1.3) translateY(-180px);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .wave-band,
      .wave-swell {
        animation: none;
      }
    }
  </style>
  <rect class="wave-base" width="480" height="360" />
  <g class="wave-swell">
    <path
      class="wave-band wave-band--back"
      d="M-720 180 c80 -20 160 -20 240 0 c80 20 160 20 240 0 c80 -20 160 -20 240 0 c80 20 160 20 240 0 c80 -20 160 -20 240 0 c80 20 160 20 240 0 c80 -20 160 -20 240 0 c80 20 160 20 240 0 L1200 1000 L-720 1000 Z"
    />
  </g>
  <g class="wave-swell wave-swell--front">
    <path
      class="wave-band wave-band--front"
      d="M-720 180 c80 -20 160 -20 240 0 c80 20 160 20 240 0 c80 -20 160 -20 240 0 c80 20 160 20 240 0 c80 -20 160 -20 240 0 c80 20 160 20 240 0 c80 -20 160 -20 240 0 c80 20 160 20 240 0 L1200 1000 L-720 1000 Z"
    />
  </g>
</svg>
